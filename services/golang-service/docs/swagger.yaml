definitions:
  Request.ExecuteVndPaymentRequest:
    properties:
      id_payment:
        type: string
      order:
        $ref: '#/definitions/Request.PaymentOrderData'
      permit:
        $ref: '#/definitions/Request.PermitData'
      signature:
        type: string
    required:
    - id_payment
    - order
    - signature
    type: object
  Request.PaymentOrderData:
    properties:
      amount:
        example: "0"
        type: string
      booking_id:
        type: string
      deadline:
        type: integer
      nonce:
        type: integer
      order_id:
        type: string
      payer:
        type: string
    type: object
  Request.PaymentRequest:
    properties:
      amount:
        type: number
      id_booking:
        type: string
      id_booking_tour:
        type: string
      id_booking_transport:
        type: string
      id_user:
        type: string
    required:
    - amount
    - id_user
    type: object
  Request.PermitData:
    properties:
      deadline:
        type: integer
      r:
        type: string
      s:
        type: string
      v:
        type: integer
      value:
        type: string
    type: object
  Request.PrepareVndPaymentRequest:
    properties:
      amount:
        type: number
      id_booking:
        type: string
      id_booking_tour:
        type: string
      id_booking_transport:
        type: string
      id_user:
        type: string
      payer_address:
        type: string
    required:
    - amount
    - id_user
    - payer_address
    type: object
  Request.ReportRevenueRequest:
    properties:
      idAccommodation:
        type: string
      month:
        type: integer
      year:
        type: integer
    type: object
  Request.RevenueCreatedEvent:
    properties:
      amount:
        type: number
      idAccommodation:
        type: string
      idBooking:
        type: string
      idExpense:
        type: string
      month:
        type: integer
      year:
        type: integer
    type: object
  Request.RevenueUpdateEvent:
    properties:
      amount:
        type: number
      idBooking:
        type: string
      idExpense:
        type: string
    type: object
  Request.ZaloPayCallBackRequest:
    properties:
      data:
        type: string
      mac:
        type: string
    required:
    - data
    - mac
    type: object
  Response.EIP712Domain:
    properties:
      chainId:
        type: integer
      name:
        type: string
      verifyingContract:
        type: string
      version:
        type: string
    type: object
  Response.EIP712TypedData:
    properties:
      domain:
        $ref: '#/definitions/Response.EIP712Domain'
      message:
        additionalProperties: true
        type: object
      primaryType:
        type: string
      types:
        additionalProperties:
          items:
            $ref: '#/definitions/Response.TypeField'
          type: array
        type: object
    type: object
  Response.ExecuteVndPaymentResponse:
    properties:
      explorer_url:
        type: string
      id_payment:
        type: string
      status:
        type: string
      tx_hash:
        type: string
    type: object
  Response.PrepareVndPaymentResponse:
    properties:
      id_payment:
        type: string
      order_id:
        type: string
      typed_data:
        $ref: '#/definitions/Response.EIP712TypedData'
      vnd_token_address:
        type: string
    type: object
  Response.TypeField:
    properties:
      name:
        type: string
      type:
        type: string
    type: object
info:
  contact: {}
paths:
  /api/v1/payments:
    post:
      consumes:
      - application/json
      parameters:
      - description: Thông tin thanh toán
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/Request.PaymentRequest'
      produces:
      - application/json
      responses: {}
      tags:
      - Payment
  /api/v1/payments/callback:
    post:
      consumes:
      - application/json
      parameters:
      - description: Dữ liệu callback
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/Request.ZaloPayCallBackRequest'
      produces:
      - application/json
      responses: {}
      tags:
      - Payment
  /api/v1/payments/vnd/execute:
    post:
      consumes:
      - application/json
      description: Verifies the signature and submits the on-chain transaction to
        Sepolia.
      parameters:
      - description: Execute Payment Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/Request.ExecuteVndPaymentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Response.ExecuteVndPaymentResponse'
        "400":
          description: Bad Request or Invalid Signature
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Payment record not found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict - Already being processed
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Execute VND Payment
      tags:
      - VndPayment
  /api/v1/payments/vnd/nonce/{address}:
    get:
      description: Returns the current on-chain nonce for a specific Ethereum wallet
        address.
      parameters:
      - description: Ethereum Wallet Address
        in: path
        name: address
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request - Invalid Address
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get Wallet Nonce
      tags:
      - VndPayment
  /api/v1/payments/vnd/prepare:
    post:
      consumes:
      - application/json
      description: Prepares EIP-712 typed data for the user to sign before executing
        the payment.
      parameters:
      - description: Prepare Payment Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/Request.PrepareVndPaymentRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/Response.PrepareVndPaymentResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Prepare VND Payment
      tags:
      - VndPayment
  /report-revenues-detail/create:
    post:
      consumes:
      - application/json
      parameters:
      - description: Thông tin chi tiết báo cáo
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/Request.RevenueCreatedEvent'
      produces:
      - application/json
      responses: {}
      tags:
      - Report Revenue Detail
  /report-revenues-detail/update:
    put:
      consumes:
      - application/json
      parameters:
      - description: Thông tin cập nhật
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/Request.RevenueUpdateEvent'
      produces:
      - application/json
      responses: {}
      tags:
      - Report Revenue Detail
  /report-revenues/{idReportRevenue}:
    delete:
      consumes:
      - application/json
      parameters:
      - description: ID báo cáo
        in: path
        name: idReportRevenue
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      tags:
      - Report Revenue
  /report-revenues/create:
    post:
      consumes:
      - application/json
      parameters:
      - description: Thông tin báo cáo
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/Request.ReportRevenueRequest'
      produces:
      - application/json
      responses: {}
      tags:
      - Report Revenue
  /report-revenues/inf-report-revenue-by-month:
    get:
      consumes:
      - application/json
      parameters:
      - description: ID Accommodation
        in: query
        name: idAccommodation
        required: true
        type: string
      - description: Tháng
        in: query
        name: month
        required: true
        type: integer
      - description: Năm
        in: query
        name: year
        required: true
        type: integer
      produces:
      - application/json
      responses: {}
      tags:
      - Report Revenue
  /report-revenues/yearly-stats:
    get:
      consumes:
      - application/json
      parameters:
      - description: ID Accommodation
        in: query
        name: idAccommodation
        required: true
        type: string
      - description: Năm
        in: query
        name: year
        required: true
        type: integer
      produces:
      - application/json
      responses: {}
      tags:
      - Report Revenue
  /report-type-room-booking/{idReportRoomBooking}:
    delete:
      consumes:
      - application/json
      parameters:
      - description: ID báo cáo
        in: path
        name: idReportRoomBooking
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      tags:
      - Report Type Room Booking
  /report-type-room-booking/inf-report-type-room-booking-by-month:
    get:
      consumes:
      - application/json
      parameters:
      - description: ID Accommodation
        in: query
        name: idAccommodation
        required: true
        type: string
      - description: Tháng
        in: query
        name: month
        required: true
        type: integer
      - description: Năm
        in: query
        name: year
        required: true
        type: integer
      produces:
      - application/json
      responses: {}
      tags:
      - Report Type Room Booking
swagger: "2.0"
