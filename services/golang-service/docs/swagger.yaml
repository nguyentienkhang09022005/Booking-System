basePath: /
definitions:
  Request.PaymentRequest:
    properties:
      amount:
        type: number
      id_booking:
        type: string
      id_user:
        type: string
    required:
    - amount
    - id_booking
    - id_user
    type: object
  Request.ReportRevenueRequest:
    properties:
      idHotel:
        type: string
      month:
        type: integer
      year:
        type: integer
    type: object
  Request.RevenueCreatedEvent:
    properties:
      amount:
        type: number
      idBooking:
        type: string
      idExpense:
        type: string
      idHotel:
        type: string
      month:
        type: integer
      year:
        type: integer
    type: object
  Request.ZaloPayCallBackRequest:
    properties:
      data:
        type: string
      mac:
        type: string
    required:
    - data
    - mac
    type: object
info:
  contact: {}
  title: Golang-Service API
  version: "1.0"
