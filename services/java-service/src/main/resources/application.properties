spring.application.name=${SPRING_APPLICATION_NAME}
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL}
spring.jpa.properties.hibernate.dialect=${SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL}

jwt.signerKey=${JWT_SIGNERKEY}

cloudinary.cloudName=${CLOUDINARY_CLOUDNAME}
cloudinary.apiKey=${CLOUDINARY_APIKEY}
cloudinary.apiSecret=${CLOUDINARY_APISECRET}

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

golang.service=${GOLANG_SERVICE}

java.service=${JAVA_SERVICE}

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED}
spring.data.redis.timeout=${REDIS_TIMEOUT}

gemini.api.url=${GEMINI_API_URL}
gemini.apiKey.user=${GEMINI_APIKEY_USER}
gemini.apiKey.company=${GEMINI_APIKEY_COMPANY}
gemini.api.key=${GEMINI_APIKEY}

groq.api.key=${GROQ_API_KEY}
groq.base.url=${GROQ_BASE_URL}

spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.virtual-host=${RABBITMQ_VIRTUAL_HOST}
spring.rabbitmq.ssl.enabled=false

rabbitmq.exchange.notification=${RABBITMQ_EXCHANGE_NOTIFICATION}
rabbitmq.queue.notification=${RABBITMQ_QUEUE_NOTIFICATION}
rabbitmq.routing.key.notification=${RABBITMQ_ROUTING_KEY_NOTIFICATION}

server.forward-headers-strategy=framework

springdoc.swagger-ui.config-url=../v3/api-docs/swagger-config
springdoc.swagger-ui.url=../v3/api-docs