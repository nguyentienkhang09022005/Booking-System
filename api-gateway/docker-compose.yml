version: '3.9'
services:
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_APPLICATION_NAME: ${SPRING_APPLICATION_NAME}

      SPRING_CLOUD_GATEWAY_ROUTES_0_ID: ${SPRING_CLOUD_GATEWAY_ROUTES_0_ID}
      SPRING_CLOUD_GATEWAY_ROUTES_0_URI: ${SPRING_CLOUD_GATEWAY_ROUTES_0_URI}
      SPRING_CLOUD_GATEWAY_ROUTES_0_PREDICATES_0: ${SPRING_CLOUD_GATEWAY_ROUTES_0_PREDICATES_0}

      SPRING_CLOUD_GATEWAY_ROUTES_1_ID: ${SPRING_CLOUD_GATEWAY_ROUTES_1_ID}
      SPRING_CLOUD_GATEWAY_ROUTES_1_URI: ${SPRING_CLOUD_GATEWAY_ROUTES_1_URI}
      SPRING_CLOUD_GATEWAY_ROUTES_1_PREDICATES_0: ${SPRING_CLOUD_GATEWAY_ROUTES_1_PREDICATES_0}
    env_file:
      - .env
