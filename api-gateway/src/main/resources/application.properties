spring.application.name=${SPRING_APPLICATION_NAME:api-gateway}

# ==========================================
# Authentication - Service
# ==========================================
spring.cloud.gateway.routes[0].id=authentication-service
spring.cloud.gateway.routes[0].uri=${GATEWAY_DOMAIN_URI}
spring.cloud.gateway.routes[0].predicates[0]=${AUTH_SERVICE_PREDICATES}
spring.cloud.gateway.routes[0].filters[0]=PrefixPath=/authentication-service
spring.cloud.gateway.routes[0].filters[1]=SetRequestHeader=Host, ${GATEWAY_HOST_HEADER}
spring.cloud.gateway.routes[0].filters[2]=SetRequestHeader=User-Agent, Mozilla/5.0

# ==========================================
# Java - Service
# ==========================================
spring.cloud.gateway.routes[1].id=java-service
spring.cloud.gateway.routes[1].uri=${GATEWAY_DOMAIN_URI}
spring.cloud.gateway.routes[1].predicates[0]=${JAVA_SERVICE_PREDICATES}
spring.cloud.gateway.routes[1].filters[0]=PrefixPath=/java-service
spring.cloud.gateway.routes[1].filters[1]=SetRequestHeader=Host, ${GATEWAY_HOST_HEADER}
spring.cloud.gateway.routes[1].filters[2]=SetRequestHeader=User-Agent, Mozilla/5.0

# ==========================================
# Golang - Service
# ==========================================
spring.cloud.gateway.routes[2].id=golang-service
spring.cloud.gateway.routes[2].uri=${GATEWAY_DOMAIN_URI}
spring.cloud.gateway.routes[2].predicates[0]=${GOLANG_SERVICE_PREDICATES}
spring.cloud.gateway.routes[2].filters[0]=PrefixPath=/golang-service
spring.cloud.gateway.routes[2].filters[1]=SetRequestHeader=Host, ${GATEWAY_HOST_HEADER}
spring.cloud.gateway.routes[2].filters[2]=SetRequestHeader=User-Agent, Mozilla/5.0

# ==========================================
# Nodejs - Service
# ==========================================
spring.cloud.gateway.routes[3].id=nodejs-service
spring.cloud.gateway.routes[3].uri=${GATEWAY_DOMAIN_URI}
spring.cloud.gateway.routes[3].predicates[0]=${NODEJS_SERVICE_PREDICATES}
spring.cloud.gateway.routes[3].filters[0]=PrefixPath=/nodejs-service
spring.cloud.gateway.routes[3].filters[1]=SetRequestHeader=Host, ${GATEWAY_HOST_HEADER}
spring.cloud.gateway.routes[3].filters[2]=SetRequestHeader=User-Agent, Mozilla/5.0

# URL g?i n?i b? t? Gateway sang Authen Service
authentication.service=${GATEWAY_DOMAIN_URI}/authentication-service

# Logging
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.org.springframework.http.server.reactive=DEBUG
logging.level.org.springframework.web.reactive=DEBUG
logging.level.reactor.netty=DEBUG